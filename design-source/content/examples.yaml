    title: Customer story, Hale Farm kitchen
    meta: From Jess’s idea and the project notes · Due Thursday
    request_label: Idea from Jess
    message: Turn the Hale Farm kitchen into a short customer story. Focus on the reclaimed oak and the six-week fit.
    draft_label: Draft story
    draft_chip: Ready for your review
    draft: The Hales wanted a kitchen made from their barn’s own oak. We reclaimed 40 beams and finished the fit in six weeks, with a temporary kitchen so the family could keep cooking.

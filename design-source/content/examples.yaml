    title: Parking and dogs at Harbour Loft
    meta: Tom, arriving Saturday · 22:41
    request_label: Guest message
    message: Hi, where do we park when we arrive? And is it OK to bring our dog?
    draft_label: Answer sent
    draft_chip: From your house guide
    draft: Hi Tom, there’s a private space behind the cottage, marked Harbour Loft. One well-behaved dog is welcome, and there’s a bowl and towels in the utility room.

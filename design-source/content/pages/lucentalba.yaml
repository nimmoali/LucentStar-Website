# LucentAlba product page. Approved copy, 17 October 2026: preserve the
# wording and sequence. The online version is coming soon and consulting is
# available now. The opening "Get started" opens the AI visibility enquiry;
# "Join the waiting list" (waitlist panel and closing band) opens the
# waitlist form.
# Sections: opening, statement, buyer journey, example, process, closing band
# (id: contact, so @contact links open the shared contact panel in place).

slug: lucentalba
url: /lucentalba
title: LucentAlba
seo_title: LucentAlba | Be the business AI recommends
description: We find where your business can grow through AI, show you what will make the difference, and help you make it happen. LucentAlba from LucentStar AI.
nav_current: products
theme: albedo
extra_icons: true

sections:

  - type: page_hero
    product: albedo
    heading: Be the business *AI recommends.*
    tagline: Be found. Be chosen. Grow.
    lead: We find where your business can grow through AI, show you what will make the difference, and help you make it happen.
    actions:
      - {label: Get started, href: "@contact", style: primary, topic: visibility, icon: arrow}
    note: false

  - type: statement
    id: asking
    heading: Your next customer is asking AI.
    key_last: true
    lines:
      - They’re looking for recommendations, comparing businesses and deciding who to choose.
      - We help put your business on their shortlist.
    # Waitlist panel. The countdown runs to launch_at. The button opens the
    # shared Contact us panel in its waitlist mode (scripts/07-alba.js), which
    # sends through the existing enquiry route with the AI visibility topic.
    # The joined figure starts at base on base_date and is SIMULATED: each
    # day after base_date it adds a different amount between daily_min and
    # daily_max. It does not read the sign-up database. Owner decision needed
    # before release (see HANDOFF.md).
    waitlist:
      heading: Join the waitlist.
      text: Get access before the public launch.
      launch_at: "2026-11-07T09:00:00Z"
      countdown_sr: The public launch is on 7 November 2026.
      units:
        - {key: d, label: Days, start: 21}
        - {key: h, label: Hours, start: 0}
        - {key: m, label: Minutes, start: 0}
        - {key: s, label: Seconds, start: 0}
      action: {label: Join the waiting list, href: "@contact", topic: visibility, icon: arrow}
      joined: {base: 564, base_date: "2026-10-17", daily_min: 3, daily_max: 11, suffix: "+ already joined"}
      # Other buttons that open the waitlist form (the closing band's button)
      also_opens: "#contact .band a.btn"
      panel:
        heading: Join the waitlist
        lead: Get access before the public launch.
        send: Join the waiting list
        message: Please add me to the LucentAlba waitlist.
        done_title: Thank you, {name}. Your waitlist request was received.
        done_text: We’ll email {email} before the public launch.

  - type: journey
    id: journey
    tone: cloud
    heading: Be there from the first question to the final decision.
    lead: Getting mentioned is one thing. Getting recommended when someone is ready to buy is another.
    stages:
      - {label: Get discovered, question: "“What are my options?”"}
      - {label: Make the shortlist, question: "“Who should I consider?”"}
      - {label: Stand out, question: "“How do they compare?”"}
      - {label: Get chosen, question: "“Who should I go with?”"}

  # The real example (question, answer, next action) is added here once
  # approved material exists. Until then only the line below is shown.
  - type: example_flow
    id: example
    heading: Less reporting. More doing.
    lead: No dashboards to decode. Just the question, what AI said, and what to do about it.
    key_last: true
    flow: [Buyer question, AI answer, Your next action]

  - type: process
    id: how
    tone: cloud
    heading: We find it. You fix it. We track it.
    steps:
      - {icon: search, word: Find., text: We discover where your business can reach more buyers.}
      - {icon: check, word: Fix., text: "You get clear, prioritised actions to make the improvements that matter."}
      - {icon: loop, word: Track., text: We measure what’s changing and where you’re making progress.}

  - type: cta_band
    id: contact
    heading: Don’t just be seen. *Be chosen.*
    lead: Make AI a new opportunity for your business.
    actions:
      - {label: Join the waiting list, href: "@contact", style: pill, topic: visibility, icon: arrow}

    status: planned
    text: We’ll confirm what it includes, and when it will be available, before it launches.

showcase: albedo
showcase_content:
  heading: Understand how your business appears in AI answers.
  lead: When someone asks an AI tool about the kind of products or services you offer, does your business appear? How is it described, and what supports that answer? LucentAlbedo is being built to show you the evidence and help you decide what deserves attention.
  actions:
    - {label: Talk about AI visibility, href: "@contact", style: pill, topic: visibility}
    - {label: See planned features, href: "lucentalbedo#features", sr: " for LucentAlbedo"}
  steps_label: How a report comes together, in four steps
  # Shown above the report on the homepage: the report is the planned online
  # version's design, not today's consulting deliverable or a live product
  planned_label: How a report is designed to work in the online version
  steps:
    - title: A buyer’s question
      text: Written the way a real customer might ask it, and recorded exactly.
      static_text: Written the way a real customer might ask it, and recorded exactly.
    - title: The saved AI answer
      text: Saved in full with the date, the tool and how it was asked. Here, Fernhill is named, but for homes rather than offices.
      static_text: Saved in full with the date, the tool and how it was asked. Fernhill is named, but for homes rather than offices.
    - title: The evidence
      text: Mentions, recommendations and cited sources are kept separate. Anything we didn’t check stays “not assessed”, never zero.
      static_text: Mentions, recommendations and cited sources are kept separate. Anything we didn’t check stays “not assessed”, never zero.
    - title: A clear next step
      text: A proportionate action tied to the evidence. Next time, the same question would be asked the same way.
      static_text: A proportionate action tied to the evidence.
  limits: "**Example using fictional data.** It shows one question, one assistant and one day. AI answers vary between accounts, locations and sessions, and change over time, so a report shows what was captured under stated conditions, not what every customer sees."
  # Example report screen (fictional business, question and answer)
  app:
    tab: Evidence
    business_initials: FS
    business_label: Report for
    business: Fernhill Studio
    panel_label: Report for Fernhill Studio
    question_label: The buyer’s question
    question: “Who are good interior designers in Manchester for small office fit-outs?”
    question_meta: One general-purpose AI assistant · Signed out · UK · 14 September 2026
    answer_label: Saved answer, excerpt
    answer_before: For small office fit-outs, Calder & Moss and Atelier North are often recommended for commercial work.
    answer_mark: Fernhill Studio is another Manchester practice, mainly known for residential interiors.
    source_label: Source cited
    source: manchester-design-directory.example
    evidence_label: The evidence
    evidence:
      - {label: Mentioned, value: "Yes", kind: count}
      - {label: Recommended, value: "No"}
      - {label: Own website cited, value: "No"}
      - {label: Signed-in answers, value: Not assessed, kind: na}
    evidence_note: The description matches an older directory listing.
    action_label: Next step
    action: Update the directory listing to include office fit-outs, and make that service easy to find on Fernhill’s own site.
    action_then: Then ask the same question, the same way, in the next report.

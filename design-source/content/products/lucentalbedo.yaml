# Shown with the product wherever its status is explained
status_note: "**Coming soon.** A limited online version is planned. Contact us to discuss an AI visibility consulting project and agree an appropriate scope and deliverables."

# Planned features. None of these is confirmed for release yet; each one is
# labelled "Planned" on the site. Change status to "available" only once a
# feature is released and tested.
planned_features:
  - title: Questions based on how your customers choose
    text: Questions researched from your business, services, customers and markets. You confirm them before anything is asked.
    status: planned
  - title: Answers saved with their conditions
    text: Each answer is kept in full, with the assistant, date and settings used, so you can see exactly what was captured.
    status: planned
  - title: How your business is described
    text: Whether you’re mentioned or recommended, and how your services are described. Mentions, recommendations and cited sources stay separate.
    status: planned
  - title: Who else is named
    text: The other businesses that appear for the same questions, and how they’re described.
    status: planned
  - title: The websites behind the answers
    text: The sources AI answers draw on, including your own website and the directories and articles that mention you.
    status: planned
  - title: Next steps and progress
    text: Proportionate actions tied to the evidence, and a like-for-like comparison when the same questions are asked again.
    status: planned


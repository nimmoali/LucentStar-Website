{# Shared frame for small LucentSignal screens on the product page: the dark
   app surface with the LucentSignal mark and the name of the screen. #}
{% macro frame(tab, cls='') -%}
<div class="mini sg-ui{{ ' ' ~ cls if cls else '' }}">
  <div class="mini-top"><svg class="sg-logo" viewBox="0 0 56 56" aria-hidden="true"><path d="M28 4.5 L29.4 24.3 L44.3 14 L31.7 26.6 L51.5 28 L31.7 29.4 L44.3 42 L29.4 31.7 L28 51.5 L26.6 31.7 L13.7 42 L26.3 29.4 L4.5 28 L26.3 26.6 L13.7 14 L26.6 24.3 Z" fill="#00E676"/></svg>{{ wordmark(p, 'dark', 'sg-word') }}<span class="mini-tab">{{ tab }}</span></div>
  <div class="mini-body">{{ caller() }}</div>
</div>
{%- endmacro %}
